name: iloca_flutter
description: "iLoca SFT 2026 - Application Mobile Spatiale de Gestion de Flotte & Location (Android & iOS) avec Synchronisation Temps Réel Supabase & GPSWOX."
publish_to: "none"
version: 2.6.0+2026

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Real-Time Synchronization (Web <-> Android <-> iOS)
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # Interactive Maps & Geolocation (Google Maps Layers, Live Traceur & Trajectory)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 2026 Design System, Charts, Typography & Icons
  fl_chart: ^0.69.0
  lucide_icons_flutter: ^4.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dependency_overrides:
  app_links: 6.3.2
  shared_preferences_android: 2.4.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

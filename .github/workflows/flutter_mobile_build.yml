name: Build iLOCA 2026 Flutter (Android APK & iOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'iloca_flutter/**'
      - '.github/workflows/flutter_mobile_build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Flutter 2026)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Runner Files & Get Dependencies
        working-directory: iloca_flutter
        run: |
          cp -r lib /tmp/iloca_lib_backup
          cp pubspec.yaml /tmp/iloca_pubspec_backup.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          flutter create . --project-name iloca_flutter --org com.sft.iloca --platforms=android,ios
          cp -r /tmp/iloca_lib_backup/* lib/
          cp /tmp/iloca_pubspec_backup.yaml pubspec.yaml
          cp /tmp/AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          rm -rf test/widget_test.dart
          flutter pub get

      - name: Build Release APK
        working-directory: iloca_flutter
        run: flutter build apk --release

      - name: Rename APK to iLOCA-2026.apk
        working-directory: iloca_flutter
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/iLOCA-2026.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iLOCA-2026-Android-Release-APK
          path: iloca_flutter/build/app/outputs/flutter-apk/iLOCA-2026.apk

      - name: Publish APK to GitHub Release (v2026-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026-apk
          name: "iLOCA PRO 2026 - Android APK (Spatial Edition)"
          files: iloca_flutter/build/app/outputs/flutter-apk/iLOCA-2026.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
